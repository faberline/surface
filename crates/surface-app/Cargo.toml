[package]
name = "surface-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# The jet bridge is an adapter over the devtools executor, so it needs `devtools`.
bridge = ["dep:jet-bridge-protocol", "devtools"]
# Trace recorder and devtools executor for agents and tests. Off by default.
devtools = ["dep:surface-devtools-protocol"]

[dependencies]
surface.workspace = true
thiserror.workspace = true
unicode-segmentation.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
jet-bridge-protocol = { workspace = true, optional = true }
surface-devtools-protocol = { workspace = true, optional = true }

[lints]
workspace = true
