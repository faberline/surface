<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Surface · Rust / WASM / WebGPU</title>
<link rel="icon" href="data:,">
<style>
  * {box-sizing:border-box} html,body {margin:0;background:#141218;color:#e6e0e9;font:14px system-ui}
  header {height:44px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}
  canvas {display:block;width:100vw!important;height:calc(100dvh - 44px)!important;outline:none}
</style>
<header><span>Surface · Rust application framework</span><span id="status">Starting WebGPU…</span></header>
<canvas id="surface" tabindex="0" aria-label="Surface Material showcase"></canvas>
<script type="module">
  import init, * as showcase from '%SURFACE_JS%';
  const status=document.querySelector('#status');
  try {
    if (!navigator.gpu) throw new Error('WebGPU is unavailable. Use a browser with WebGPU on HTTPS or localhost.');
    await init();
    window.showcase=showcase;
    document.querySelector('#surface').focus();
  } catch(error) {status.textContent=String(error);console.error(error);}
</script>
</html>
