<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Surface · Material gallery</title>
<link rel="icon" href="data:,">
<style>
*{box-sizing:border-box}html,body{margin:0;background:#141218;color:#e6e0e9;font:14px system-ui}
header{height:44px;padding:0 24px;display:flex;align-items:center;justify-content:space-between}
canvas{display:block;width:100vw!important;height:calc(100dvh - 44px)!important;outline:none}
</style>
<header><span>Surface · Material gallery</span><span id="status">Starting WebGPU…</span></header>
<canvas id="surface" tabindex="0" aria-label="Material gallery"></canvas>
<script type="module">
import init,* as gallery from '%SURFACE_JS%';
try{if(!navigator.gpu)throw new Error('WebGPU is unavailable.');await init();window.gallery=gallery;document.querySelector('canvas').focus();}
catch(error){document.querySelector('#status').textContent=String(error);console.error(error);}
</script>
</html>
