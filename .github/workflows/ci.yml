name: Rust
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build-and-behavior:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - run: python3 -I scripts/check-provenance.py
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
      - run: cargo check --locked --target wasm32-unknown-unknown -p surface-showcase -p surface-material-gallery --all-features --lib
      # Jet builds ui-runtime for wasm32 with and without `debug`. The consumer
      # contract test pins the surface and ui-runtime API that Jet and Core use.
      - run: cargo check --locked --target wasm32-unknown-unknown -p ui-runtime --all-features --lib --test consumer_contract
      - run: cargo check --locked --target wasm32-unknown-unknown -p ui-runtime --no-default-features --lib --test consumer_contract
