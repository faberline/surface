[workspace]
resolver = "2"
members = ["crates/*", "examples/showcase", "examples/material-gallery"]
default-members = ["crates/surface", "crates/ui-runtime", "crates/surface-app", "crates/surface-material"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Chris Cheng <chris.cheng.c4@gmail.com>"]
repository = "https://github.com/faberline/surface"

[workspace.dependencies]
surface = { path = "crates/surface" }
ui-runtime = { path = "crates/ui-runtime" }
surface-app = { path = "crates/surface-app" }
surface-material = { path = "crates/surface-material" }
surface-wgpu = { path = "crates/surface-wgpu" }
surface-platform = { path = "crates/surface-platform" }
jet-bridge-protocol = { git = "https://github.com/faberline/jet-bridge", rev = "a21f93425f8f27dfc7ab2bea0c34fdebcc71335f" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
taffy = "0.7.7"
wgpu = "24.0.5"
glyphon = "0.8"
winit = "0.30.13"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
unicode-segmentation = "1.13"

[workspace.lints.clippy]
mod_module_files = "deny"

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
